[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-toolbox"
version = "0.1.0"
description = "Modern Python media inspection, transcoding, and audio extraction package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tazztone" }]
dependencies = [
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
media-toolbox = "media_toolbox.cli:main"
media_toolbox = "media_toolbox.cli:main"
media-toolbox-gui = "media_toolbox.ui.app:main"
media_toolbox_gui = "media_toolbox.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"media_toolbox.nautilus" = ["*.sh", "*.desktop"]
