name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          # Pinned: lint policy is the pinned version's default rule set.
          # Bump the pin and the dev extra in pyproject.toml together.
          pip install "ruff==0.17.1"

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  headless-tests:
    name: Headless Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Ensure Headless Environment (Mask FFmpeg Binaries)
        run: |
          sudo rm -f $(which ffmpeg 2>/dev/null) $(which ffprobe 2>/dev/null) || true

      - name: Install Headless Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run AST Headless Invariant Tests
        run: |
          pytest tests/test_headless_ast.py

      - name: Run Headless Core & CLI Tests with Coverage
        run: |
          pytest --cov=media_toolbox.core --cov-report=term-missing --cov-fail-under=85 -m "not desktop and not integration"

  integration-tests:
    name: FFmpeg Integration Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg & FFprobe Available
        run: |
          which ffmpeg
          which ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Real FFmpeg Integration Tests
        run: |
          pytest -m "integration"

  desktop-tests:
    name: Desktop & GUI Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (FFmpeg, GTK4, Libadwaita, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-4-dev libadwaita-1-dev gir1.2-adw-1 xvfb desktop-file-utils libgirepository-2.0-dev libcairo2-dev

      - name: Install Full Package with Desktop Extras
        run: |
          python -m pip install --upgrade pip
          pip install .[all]

      - name: Run Desktop & GUI Tests in Virtual Framebuffer
        run: |
          xvfb-run pytest -m "desktop"

  packaging-smoke-test:
    name: Wheel Build & Installation Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Install Wheel in Isolated Environment
        run: |
          pip install dist/*.whl

      - name: Verify CLI Executable Entrypoints
        run: |
          media-toolbox --version
          media_toolbox --version
          media-toolbox --help
          media-toolbox inspect --help
          media-toolbox transcode --help

      - name: Run Headless Tests Against Installed Package (No Source Injection)
        run: |
          pip install pytest
          TEST_INSTALLED=1 pytest -o pythonpath="" -m "not desktop and not integration" tests/

  typecheck:
    name: Headless Type Check (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Create venv and install package
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install .[dev]
      - name: Run basedpyright (Headless Core & CLI)
        run: .venv/bin/basedpyright src/media_toolbox/core src/media_toolbox/cli tests/test_builder.py tests/test_jobs.py tests/test_cli.py tests/test_validation.py tests/test_probe.py tests/test_bitrate.py tests/test_runner.py tests/test_filtergraph.py tests/test_presets.py tests/test_models.py tests/test_formatters.py tests/test_headless_ast.py

  desktop-typecheck:
    name: Desktop & UI Type Check (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install System Dependencies (GTK4, Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gir1.2-adw-1 libgirepository-2.0-dev libcairo2-dev python3-gi python3-gi-cairo
      - name: Create venv with system site-packages and install package
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install .[all]
      - name: Run basedpyright (Full Suite)
        run: .venv/bin/basedpyright src tests

  audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit
