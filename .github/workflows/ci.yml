name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless-tests:
    name: Headless Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Headless Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run AST Headless Invariant Tests
        run: |
          pytest tests/test_headless_ast.py

      - name: Run Headless Core & CLI Tests
        run: |
          pytest -k "not test_ui and not test_nautilus"

  desktop-tests:
    name: Desktop & GUI Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (FFmpeg, GTK4, Libadwaita, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-4-dev libadwaita-1-dev gir1.2-adw-1 xvfb desktop-file-utils libgirepository-2.0-dev libcairo2-dev

      - name: Install Full Package with Desktop Extras
        run: |
          python -m pip install --upgrade pip
          pip install .[all]

      - name: Run Full Test Suite in Virtual Framebuffer
        run: |
          xvfb-run pytest tests/

  packaging-smoke-test:
    name: Wheel Build & Installation Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Install Wheel in Isolated Environment
        run: |
          pip install dist/*.whl

      - name: Verify CLI Executable Entrypoints
        run: |
          media-toolbox --version
          media_toolbox --version
          media-toolbox --help
          media-toolbox inspect --help
          media-toolbox transcode --help
