[pytest]
testpaths = tests
pythonpath = src
addopts = -ra -q --import-mode=importlib
markers =
    unit: Fast in-memory unit tests
    integration: Integration tests exercising external FFmpeg/ffprobe binaries
    desktop: Desktop GUI (Libadwaita / PyGObject / Nautilus) tests requiring graphical environment
filterwarnings =
    # Upstream PyGObject: load_overrides() triggers its own PyGIDeprecationWarning
    # for GLib.unix_signal_add_full. DeprecationWarning covers PyGIDeprecationWarning.
    ignore::DeprecationWarning:gi\.overrides$
    # Upstream PyGObject gi.events: asyncio policy API deprecated in Python 3.12+/3.14.
    # Inert after the main-context refactor; kept as insurance for other PyGObject builds.
    ignore::DeprecationWarning:gi\.events$
